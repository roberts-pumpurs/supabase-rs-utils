[package]
name = "rp-supabase-codegen"
description = "Build-script-first Rust bindings for PostgreSQL and Supabase schemas"
version = "0.9.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true
rust-version = "1.85"
readme = "README.md"

[features]
default = []
database = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
heck = "0.5"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
postgres = { version = "=0.19.10", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }

[lints]
workspace = true
